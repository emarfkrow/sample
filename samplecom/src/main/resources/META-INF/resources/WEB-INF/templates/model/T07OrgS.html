<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T07OrgS.title}">T07_ORG</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T07Org.js}"></script>
<script th:src="@{/model/T07OrgGridColumns.js}"></script>
<!-- T07_ORGの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T07_ORGの子モデルのグリッド定義 -->
<script th:src="@{/model/T07OrgDet.js}"></script>
<script th:src="@{/model/T07OrgDetGridColumns.js}"></script>
<!-- T07_ORGの派生先モデルのグリッド定義 -->
<script th:src="@{/model/T07Derive1.js}"></script>
<script th:src="@{/model/T07Derive1GridColumns.js}"></script>
  <!-- T07_DERIVE1の子モデルのグリッド定義 -->
  <script th:src="@{/model/T07Derive1Det.js}"></script>
  <script th:src="@{/model/T07Derive1DetGridColumns.js}"></script>
<!-- T07_ORGの派生先モデルのグリッド定義 -->
<script th:src="@{/model/T07Derive2.js}"></script>
<script th:src="@{/model/T07Derive2GridColumns.js}"></script>
  <!-- T07_DERIVE2の子モデルのグリッド定義 -->
  <script th:src="@{/model/T07Derive2Det.js}"></script>
  <script th:src="@{/model/T07Derive2DetGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T07OrgS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T07OrgSearchForm" action="T07OrgSearch.ajax" class="search">
      <input type="hidden" name="rows" value="10" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T07OrgS.legend}">legend</legend>
        <div id="orgId">
          <label for="T07Org.orgId" th:text="#{T07Org.orgId}">ORG_ID</label><input type="text" id="T07Org.orgId" name="T07Org.orgId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="orgInfo">
          <label for="T07Org.orgInfo" th:text="#{T07Org.orgInfo}">ORG_INFO</label><input type="text" id="T07Org.orgInfo" name="T07Org.orgInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT07Org" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/T07Org.html(anew)}" target="dialog" id="T07Org" class="anew" th:text="#{T07Org.add}" tabindex="-1">T07_ORG</a>
      </div>
      <div class="submits">
        <button id="SearchT07Org" type="submit" class="search" data-gridId="T07OrgGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T07OrgSRegistForm" action="T07OrgSRegist.ajax" class="regist">
      <h3 th:text="#{T07Org.h3}">h3</h3>
      <div id="T07OrgGrid" data-selectionMode="checkbox" data-frozenColumn="0" data-editable="false" th:data-href="@{/model/T07Org.html}"></div>
      <div id="T07OrgPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT07OrgS" th:text="#{common.reset}" onClick="Base.listReset('T07Org');">reset</button>
        <a th:href="@{T07OrgSearch.xlsx(baseMei=#{T07OrgS.h2})}" id="T07OrgSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
      </div>
    </form>
  </div>
</body>
</html>
