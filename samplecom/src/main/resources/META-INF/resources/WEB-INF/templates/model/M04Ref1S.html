<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M04Ref1S.title}">M04_REF1</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M04Ref1.js}"></script>
<script th:src="@{/model/M04Ref1GridColumns.js}"></script>
<!-- M04_REF1の参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M04Ref1S.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="M04Ref1SearchForm" action="M04Ref1Search.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{M04Ref1S.legend}">legend</legend>
        <div id="ref1Id">
          <label for="M04Ref1.ref1Id" th:text="#{M04Ref1.ref1Id}">REF1_ID</label><input type="text" id="M04Ref1.ref1Id" name="M04Ref1.ref1Id" maxlength="10" class=" primaryKey" />
        </div>
        <div id="ref1Mei">
          <label for="M04Ref1.ref1Mei" th:text="#{M04Ref1.ref1Mei}">REF1_MEI</label><input type="text" id="M04Ref1.ref1Mei" name="M04Ref1.ref1Mei" maxlength="60" class="" />
        </div>
        <div id="deleteF">
          <fieldset id="M04Ref1.deleteFList" data-options="MsyKbnValSearch.json" data-optionParams="KBN_NM:delete_f" data-optionValue="KBN_VAL" data-optionLabel="KBN_VAL_MEI">
            <legend th:text="#{M04Ref1.deleteF}">delete_f</legend>
          </fieldset>
        </div>
        <div id="tekiyoBi">
          <label for="M04Ref1.tekiyoBi_1" th:text="#{M04Ref1.tekiyoBi}">TEKIYO_BI</label><input type="text" id="M04Ref1.tekiyoBi_1" name="M04Ref1.tekiyoBi_1" maxlength="10" class=" datepicker" />～<input type="text" id="M04Ref1.tekiyoBi_2" name="M04Ref1.tekiyoBi_2" maxlength="10" class=" datepicker" />
        </div>
        <div id="haishiBi">
          <label for="M04Ref1.haishiBi_1" th:text="#{M04Ref1.haishiBi}">HAISHI_BI</label><input type="text" id="M04Ref1.haishiBi_1" name="M04Ref1.haishiBi_1" maxlength="10" class=" datepicker" />～<input type="text" id="M04Ref1.haishiBi_2" name="M04Ref1.haishiBi_2" maxlength="10" class=" datepicker" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetM04Ref1" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/M04Ref1.html(anew)}" target="dialog" id="M04Ref1" class="anew" th:text="#{M04Ref1.add}" tabindex="-1">M04_REF1</a>
      </div>
      <div class="submits">
        <button id="SearchM04Ref1" type="submit" class="search" data-gridId="M04Ref1Grid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="M04Ref1SRegistForm" action="M04Ref1SRegist.ajax" class="regist">
      <h3 th:text="#{M04Ref1.h3}">h3</h3>
      <div id="M04Ref1Grid" data-selectionMode="checkbox" data-addRow="true" data-frozenColumn="0" th:data-href="@{/model/M04Ref1.html}"></div>
      <div id="M04Ref1Pager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetM04Ref1S" th:text="#{common.reset}" onClick="Base.listReset('M04Ref1');">reset</button>
        <a th:href="@{M04Ref1Search.xlsx(baseMei=#{M04Ref1S.h2})}" id="M04Ref1Search.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="RegistM04Ref1S" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
