<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M04Ref2S.title}">M04_REF2</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M04Ref2.js}"></script>
<script th:src="@{/model/M04Ref2GridColumns.js}"></script>
<!-- M04_REF2の参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M04Ref2S.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="M04Ref2SearchForm" action="M04Ref2Search.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{M04Ref2S.legend}">legend</legend>
        <div id="ref1Id" class="stint">
          <label th:text="#{M04Ref1.ref1Id}">REF1_ID</label><span id="M04Ref1.ref1Id" class="stint"></span><input type="hidden" id="M04Ref1.ref1Id" name="M04Ref1.ref1Id" class="stint" />
          <span id="M04Ref2.ref1Mei" class="refer" data-referFor="M04Ref2.ref1Id" data-json="M04Ref1Search.json" data-srcDef="REF1_ID:M04Ref2.ref1Id" data-destDef="M04Ref2.ref1Mei:REF1_MEI"></span>
        </div>
        <div id="ref2Id">
          <label for="M04Ref2.ref2Id" th:text="#{M04Ref2.ref2Id}">REF2_ID</label><input type="text" id="M04Ref2.ref2Id" name="M04Ref2.ref2Id" maxlength="10" class=" primaryKey" />
        </div>
        <div id="ref2Mei">
          <label for="M04Ref2.ref2Mei" th:text="#{M04Ref2.ref2Mei}">REF2_MEI</label><input type="text" id="M04Ref2.ref2Mei" name="M04Ref2.ref2Mei" maxlength="60" class="" />
        </div>
        <div id="deleteF">
          <fieldset id="M04Ref2.deleteFList" data-options="MsyKbnValSearch.json" data-optionParams="KBN_NM:DELETE_F" data-optionValue="KBN_VAL" data-optionLabel="KBN_VAL_MEI">
            <legend th:text="#{M04Ref2.deleteF}">DELETE_F</legend>
          </fieldset>
        </div>
        <div id="tekiyoBi">
          <label for="M04Ref2.tekiyoBi_1" th:text="#{M04Ref2.tekiyoBi}">TEKIYO_BI</label><input type="text" id="M04Ref2.tekiyoBi_1" name="M04Ref2.tekiyoBi_1" maxlength="10" class=" datepicker" />～<input type="text" id="M04Ref2.tekiyoBi_2" name="M04Ref2.tekiyoBi_2" maxlength="10" class=" datepicker" />
        </div>
        <div id="haishiBi">
          <label for="M04Ref2.haishiBi_1" th:text="#{M04Ref2.haishiBi}">HAISHI_BI</label><input type="text" id="M04Ref2.haishiBi_1" name="M04Ref2.haishiBi_1" maxlength="10" class=" datepicker" />～<input type="text" id="M04Ref2.haishiBi_2" name="M04Ref2.haishiBi_2" maxlength="10" class=" datepicker" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetM04Ref2" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/M04Ref2.html(anew)}" target="dialog" id="M04Ref2" class="anew" th:text="#{M04Ref2.add}" tabindex="-1">M04_REF2</a>
      </div>
      <div class="submits">
        <button id="SearchM04Ref2" type="submit" class="search" data-gridId="M04Ref2Grid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="M04Ref2SRegistForm" action="M04Ref2SRegist.ajax" class="regist">
      <h3 th:text="#{M04Ref2.h3}">h3</h3>
      <div id="M04Ref2Grid" data-selectionMode="checkbox" data-addRow="true" data-frozenColumn="0" th:data-href="@{/model/M04Ref2.html}"></div>
      <div id="M04Ref2Pager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetM04Ref2S" th:text="#{common.reset}" onClick="Base.listReset('M04Ref2');">reset</button>
        <a th:href="@{M04Ref2Search.xlsx(baseMei=#{M04Ref2S.h2})}" id="M04Ref2Search.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="RegistM04Ref2S" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
