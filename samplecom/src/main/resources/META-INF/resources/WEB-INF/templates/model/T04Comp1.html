        </div>
        <div id="ref2Id">
          <label for="T04Comp1.ref2Id" th:text="#{T04Comp1.ref2Id}">REF2_ID</label><input type="text" id="T04Comp1.ref2Id" name="T04Comp1.ref2Id" maxlength="10" class=" primaryKey refer notblank" data-referFor="T04Comp1.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp1.ref2Id" data-destDef="T04Comp1.ref2Mei:REF2_MEI" /><a id="T04Comp1.ref2Id" th:href="@{/model/M04Ref2S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp1.ref2Mei" class=" primaryKey refer" data-referFor="T04Comp1.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp1.ref2Id" data-destDef="T04Comp1.ref2Mei:REF2_MEI"></span>
        </div>
        <div id="comp1Mei">
          <label for="T04Comp1.comp1Mei" th:text="#{T04Comp1.comp1Mei}">COMP1_MEI</label><input type="text" id="T04Comp1.comp1Mei" name="T04Comp1.comp1Mei" maxlength="300" class="" />
        </div>
        <div id="insertTs">
          <label th:text="#{T04Comp1.insertTs}" class="meta">INSERT_TS</label><span id="T04Comp1.insertTs" class="meta YmdHmsS"></span><input type="hidden" id="T04Comp1.insertTs" name="T04Comp1.insertTs" class="meta" />

      <div id="T04Comp2Grid" data-selectionMode="link" data-addRow="true" data-frozenColumn="2" th:data-href="@{/model/T04Comp2.html}" class="childs"></div>

      <div class="submits">
        <button id="DeleteT04Comp1" type="submit" class="delete" data-action="T04Comp1Delete.ajax" th:text="#{common.delete}" tabindex="-1">delete</button>
