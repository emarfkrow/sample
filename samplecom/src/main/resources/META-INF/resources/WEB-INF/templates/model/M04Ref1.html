<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M04Ref1.title}">M04_REF1</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M04Ref1.js}"></script>
<script th:src="@{/model/M04Ref1GridColumns.js}"></script>
<!-- M04_REF1の参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M04Ref1.h2}">h2</h2>
    <form name="M04Ref1RegistForm" action="M04Ref1Regist.ajax" class="regist">
      <fieldset>
        <legend th:text="#{M04Ref1.legend}">legend</legend>
        <div id="ref1Id">
          <label for="M04Ref1.ref1Id" th:text="#{M04Ref1.ref1Id}">REF1_ID</label><input type="text" id="M04Ref1.ref1Id" name="M04Ref1.ref1Id" maxlength="10" class=" primaryKey numbering notblank" />
        </div>
        <div id="ref1Mei">
          <label for="M04Ref1.ref1Mei" th:text="#{M04Ref1.ref1Mei}">REF1_MEI</label><input type="text" id="M04Ref1.ref1Mei" name="M04Ref1.ref1Mei" maxlength="60" class=" notblank" />
        </div>
        <div id="deleteF">
          <fieldset id="M04Ref1.deleteFList" data-options="MsyKbnValSearch.json" data-optionParams="KBN_NM:DELETE_F" data-optionValue="KBN_VAL" data-optionLabel="KBN_VAL_MEI">
            <legend th:text="#{M04Ref1.deleteF}">DELETE_F</legend>
          </fieldset>
        </div>
        <div id="tekiyoBi">
          <label for="M04Ref1.tekiyoBi" th:text="#{M04Ref1.tekiyoBi}">TEKIYO_BI</label><input type="text" id="M04Ref1.tekiyoBi" name="M04Ref1.tekiyoBi" maxlength="10" class=" datepicker" />
        </div>
        <div id="haishiBi">
          <label for="M04Ref1.haishiBi" th:text="#{M04Ref1.haishiBi}">HAISHI_BI</label><input type="text" id="M04Ref1.haishiBi" name="M04Ref1.haishiBi" maxlength="10" class=" datepicker" />
        </div>
        <div id="insertTs">
          <label th:text="#{M04Ref1.insertTs}" class="meta">INSERT_TS</label><span id="M04Ref1.insertTs" class="meta YmdHmsS"></span><input type="hidden" id="M04Ref1.insertTs" name="M04Ref1.insertTs" class="meta" />
        </div>
        <div id="insertUserId">
          <label th:text="#{M04Ref1.insertUserId}" class="meta">INSERT_USER_ID</label><span id="M04Ref1.insertUserId" class="meta"></span><input type="hidden" id="M04Ref1.insertUserId" name="M04Ref1.insertUserId" class="meta" />
          <span id="M04Ref1.insertUserSei" class="refer meta" data-referFor="M04Ref1.insertUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M04Ref1.insertUserId" data-destDef="M04Ref1.insertUserSei:USER_SEI"></span>
        </div>
        <div id="updateTs">
          <label th:text="#{M04Ref1.updateTs}" class="meta">UPDATE_TS</label><span id="M04Ref1.updateTs" class="meta YmdHmsS"></span><input type="hidden" id="M04Ref1.updateTs" name="M04Ref1.updateTs" class="meta" />
        </div>
        <div id="updateUserId">
          <label th:text="#{M04Ref1.updateUserId}" class="meta">UPDATE_USER_ID</label><span id="M04Ref1.updateUserId" class="meta"></span><input type="hidden" id="M04Ref1.updateUserId" name="M04Ref1.updateUserId" class="meta" />
          <span id="M04Ref1.updateUserSei" class="refer meta" data-referFor="M04Ref1.updateUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M04Ref1.updateUserId" data-destDef="M04Ref1.updateUserSei:USER_SEI"></span>
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="RefreshM04Ref1" th:text="#{common.reset}" class="reset" onClick="Dialogate.refresh(event);">reset</button>
        <a th:href="@{M04Ref1Get.xlsx(baseMei=#{M04Ref1.h2})}" id="M04Ref1Get.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="RegistM04Ref1" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
