<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M05Cd.title}">M05_CD</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M05Cd.js}"></script>
<script th:src="@{/model/M05CdGridColumns.js}"></script>
<!-- M05_CDの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M05Cd.h2}">h2</h2>
    <form name="M05CdRegistForm" action="M05CdRegist.ajax" class="regist">
      <fieldset>
        <legend th:text="#{M05Cd.legend}">legend</legend>
        <div id="cdrefCd">
          <label for="M05Cd.cdrefCd" th:text="#{M05Cd.cdrefCd}">CDREF_CD</label><input type="text" id="M05Cd.cdrefCd" name="M05Cd.cdrefCd" maxlength="10" class=" primaryKey notblank" />
        </div>
        <div id="cdrefMei">
          <label for="M05Cd.cdrefMei" th:text="#{M05Cd.cdrefMei}">CDREF_MEI</label><input type="text" id="M05Cd.cdrefMei" name="M05Cd.cdrefMei" maxlength="60" class=" notblank" />
        </div>
        <div id="insertTs">
          <label th:text="#{M05Cd.insertTs}" class="meta">INSERT_TS</label><span id="M05Cd.insertTs" class="meta YmdHmsS"></span><input type="hidden" id="M05Cd.insertTs" name="M05Cd.insertTs" class="meta" />
        </div>
        <div id="insertUserId">
          <label th:text="#{M05Cd.insertUserId}" class="meta">INSERT_USER_ID</label><span id="M05Cd.insertUserId" class="meta"></span><input type="hidden" id="M05Cd.insertUserId" name="M05Cd.insertUserId" class="meta" />
          <span id="M05Cd.insertUserSei" class="refer meta" data-referFor="M05Cd.insertUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M05Cd.insertUserId" data-destDef="M05Cd.insertUserSei:USER_SEI"></span>
        </div>
        <div id="updateTs">
          <label th:text="#{M05Cd.updateTs}" class="meta">UPDATE_TS</label><span id="M05Cd.updateTs" class="meta YmdHmsS"></span><input type="hidden" id="M05Cd.updateTs" name="M05Cd.updateTs" class="meta" />
        </div>
        <div id="updateUserId">
          <label th:text="#{M05Cd.updateUserId}" class="meta">UPDATE_USER_ID</label><span id="M05Cd.updateUserId" class="meta"></span><input type="hidden" id="M05Cd.updateUserId" name="M05Cd.updateUserId" class="meta" />
          <span id="M05Cd.updateUserSei" class="refer meta" data-referFor="M05Cd.updateUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M05Cd.updateUserId" data-destDef="M05Cd.updateUserSei:USER_SEI"></span>
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="RefreshM05Cd" th:text="#{common.reset}" class="reset" onClick="Dialogate.refresh(event);">reset</button>
        <a th:href="@{M05CdGet.xlsx(baseMei=#{M05Cd.h2})}" id="M05CdGet.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="DeleteM05Cd" type="submit" class="delete" data-action="M05CdDelete.ajax" th:text="#{common.delete}" tabindex="-1">delete</button>
        <button id="RegistM05Cd" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
