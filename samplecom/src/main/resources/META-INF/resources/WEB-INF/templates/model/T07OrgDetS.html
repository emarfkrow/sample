<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T07OrgDetS.title}">T07_ORG_DET</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T07OrgDet.js}"></script>
<script th:src="@{/model/T07OrgDetGridColumns.js}"></script>
<!-- T07_ORG_DETの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T07_ORG_DETの親モデルのグリッド定義 -->
<script th:src="@{/model/T07Org.js}"></script>
<script th:src="@{/model/T07OrgGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T07OrgDetS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T07OrgDetSearchForm" action="T07OrgDetSearch.ajax" class="search">
      <input type="hidden" name="rows" value="10" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T07OrgDetS.legend}">legend</legend>
        <div id="orgId">
          <label for="T07OrgDet.orgId" th:text="#{T07OrgDet.orgId}">ORG_ID</label><input type="text" id="T07OrgDet.orgId" name="T07OrgDet.orgId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="orgBn">
          <label for="T07OrgDet.orgBn" th:text="#{T07OrgDet.orgBn}">ORG_BN</label><input type="text" id="T07OrgDet.orgBn" name="T07OrgDet.orgBn" maxlength="10" class=" primaryKey" />
        </div>
        <div id="detInfo">
          <label for="T07OrgDet.detInfo" th:text="#{T07OrgDet.detInfo}">DET_INFO</label><input type="text" id="T07OrgDet.detInfo" name="T07OrgDet.detInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT07OrgDet" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
      </div>
      <div class="submits">
        <button id="SearchT07OrgDet" type="submit" class="search" data-gridId="T07OrgDetGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T07OrgDetSRegistForm" action="T07OrgDetSRegist.ajax" class="regist">
      <h3 th:text="#{T07OrgDet.h3}">h3</h3>
      <div id="T07OrgDetGrid" data-selectionMode="checkbox" data-frozenColumn="1" th:data-href="@{/model/T07OrgDet.html}"></div>
      <div id="T07OrgDetPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT07OrgDetS" th:text="#{common.reset}" onClick="Base.listReset('T07OrgDet');">reset</button>
        <a th:href="@{T07OrgDetSearch.xlsx(baseMei=#{T07OrgDetS.h2})}" id="T07OrgDetSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <button type="submit" id="DeleteT07OrgDetS" data-action="T07OrgDetSDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistT07OrgDetS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
