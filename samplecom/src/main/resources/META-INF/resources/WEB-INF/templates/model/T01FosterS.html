<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T01FosterS.title}">T01_FOSTER</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T01Foster.js}"></script>
<script th:src="@{/model/T01FosterGridColumns.js}"></script>
<!-- T01_FOSTERの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T01FosterS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T01FosterSearchForm" action="T01FosterSearch.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T01FosterS.legend}">legend</legend>
        <div id="broId">
          <label for="T01Foster.broId" th:text="#{T01Foster.broId}">BRO_ID</label><input type="text" id="T01Foster.broId" name="T01Foster.broId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="fosterInfo">
          <label for="T01Foster.fosterInfo" th:text="#{T01Foster.fosterInfo}">FOSTER_INFO</label><input type="text" id="T01Foster.fosterInfo" name="T01Foster.fosterInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT01Foster" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/T01Foster.html(anew)}" target="dialog" id="T01Foster" class="anew" th:text="#{T01Foster.add}" tabindex="-1">T01_FOSTER</a>
      </div>
      <div class="submits">
        <button id="SearchT01Foster" type="submit" class="search" data-gridId="T01FosterGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T01FosterSRegistForm" action="T01FosterSRegist.ajax" class="regist">
      <h3 th:text="#{T01Foster.h3}">h3</h3>
      <div id="T01FosterGrid" data-selectionMode="checkbox" data-addRow="true" data-frozenColumn="0" th:data-href="@{/model/T01Foster.html}"></div>
      <div id="T01FosterPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT01FosterS" th:text="#{common.reset}" onClick="Base.listReset('T01Foster');">reset</button>
        <a th:href="@{T01FosterSearch.xlsx(baseMei=#{T01FosterS.h2})}" id="T01FosterSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <button type="submit" id="DeleteT01FosterS" data-action="T01FosterSDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistT01FosterS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
