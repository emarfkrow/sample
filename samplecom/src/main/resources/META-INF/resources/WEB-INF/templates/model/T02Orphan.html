<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T02Orphan.title}">T02_ORPHAN</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T02Orphan.js}"></script>
<script th:src="@{/model/T02OrphanGridColumns.js}"></script>
<!-- T02_ORPHANの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T02_ORPHANの子モデルのグリッド定義 -->
<script th:src="@{/model/T02Mago.js}"></script>
<script th:src="@{/model/T02MagoGridColumns.js}"></script>
  <!-- T02_MAGOの親モデルのグリッド定義 -->
  <script th:src="@{/model/T02Ko.js}"></script>
  <script th:src="@{/model/T02KoGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T02Orphan.h2}">h2</h2>
    <form name="T02OrphanRegistForm" action="T02OrphanRegist.ajax" class="regist">
      <fieldset>
        <legend th:text="#{T02Orphan.legend}">legend</legend>
        <div id="oyaId">
          <label for="T02Orphan.oyaId" th:text="#{T02Orphan.oyaId}">OYA_ID</label><input type="text" id="T02Orphan.oyaId" name="T02Orphan.oyaId" maxlength="10" class=" primaryKey numbering notblank" />
        </div>
        <div id="koBn">
          <label for="T02Orphan.koBn" th:text="#{T02Orphan.koBn}">KO_BN</label><input type="text" id="T02Orphan.koBn" name="T02Orphan.koBn" maxlength="10" class=" primaryKey numbering notblank" />
        </div>
        <div id="orphanInfo">
          <label for="T02Orphan.orphanInfo" th:text="#{T02Orphan.orphanInfo}">ORPHAN_INFO</label><input type="text" id="T02Orphan.orphanInfo" name="T02Orphan.orphanInfo" maxlength="300" class="" />
        </div>
        <div id="insertTs">
          <label th:text="#{T02Orphan.insertTs}" class="meta">INSERT_TS</label><span id="T02Orphan.insertTs" class="meta YmdHmsS"></span><input type="hidden" id="T02Orphan.insertTs" name="T02Orphan.insertTs" class="meta" />
        </div>
        <div id="insertUserId">
          <label th:text="#{T02Orphan.insertUserId}" class="meta">INSERT_USER_ID</label><span id="T02Orphan.insertUserId" class="meta"></span><input type="hidden" id="T02Orphan.insertUserId" name="T02Orphan.insertUserId" class="meta" />
          <span id="T02Orphan.insertUserSei" class="refer meta" data-referFor="T02Orphan.insertUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:T02Orphan.insertUserId" data-destDef="T02Orphan.insertUserSei:USER_SEI"></span>
        </div>
        <div id="updateTs">
          <label th:text="#{T02Orphan.updateTs}" class="meta">UPDATE_TS</label><span id="T02Orphan.updateTs" class="meta YmdHmsS"></span><input type="hidden" id="T02Orphan.updateTs" name="T02Orphan.updateTs" class="meta" />
        </div>
        <div id="updateUserId">
          <label th:text="#{T02Orphan.updateUserId}" class="meta">UPDATE_USER_ID</label><span id="T02Orphan.updateUserId" class="meta"></span><input type="hidden" id="T02Orphan.updateUserId" name="T02Orphan.updateUserId" class="meta" />
          <span id="T02Orphan.updateUserSei" class="refer meta" data-referFor="T02Orphan.updateUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:T02Orphan.updateUserId" data-destDef="T02Orphan.updateUserSei:USER_SEI"></span>
        </div>
      </fieldset>
      <fieldset>
        <legend th:text="#{T02Dinks.legend}">legend</legend>
        <div id="dinksInfo">
          <label for="T02Dinks.dinksInfo" th:text="#{T02Dinks.dinksInfo}">DINKS_INFO</label><input type="text" id="T02Dinks.dinksInfo" name="T02Dinks.dinksInfo" maxlength="300" class="" />
        </div>
        <input type="hidden" name="T02Dinks.updateTs" />
      </fieldset>
      <fieldset>
        <legend th:text="#{T02Ko.legend}">legend</legend>
        <div id="koInfo">
          <label for="T02Ko.koInfo" th:text="#{T02Ko.koInfo}">KO_INFO</label><input type="text" id="T02Ko.koInfo" name="T02Ko.koInfo" maxlength="300" class="" />
        </div>
        <input type="hidden" name="T02Ko.updateTs" />
      </fieldset>
      <h3 th:text="#{T02Mago.h3}">h3</h3>
      <a th:href="@{/model/T02Mago.html(anew)}" id="T02Mago" target="dialog" th:text="#{T02Mago.add}" class="addChild" tabindex="-1">T02_MAGO</a>
      <div id="T02MagoGrid" data-selectionMode="link" data-addRow="true" data-frozenColumn="2" th:data-href="@{/model/T02Mago.html}" class="childs"></div>
      <div class="buttons">
        <button type="button" id="RefreshT02Orphan" th:text="#{common.reset}" class="reset" onClick="Dialogate.refresh(event);">reset</button>
        <a th:href="@{T02OrphanGet.xlsx(baseMei=#{T02Orphan.h2})}" id="T02OrphanGet.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="DeleteT02Orphan" type="submit" class="delete" data-action="T02OrphanDelete.ajax" th:text="#{common.delete}" tabindex="-1">delete</button>
        <button id="RegistT02Orphan" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
