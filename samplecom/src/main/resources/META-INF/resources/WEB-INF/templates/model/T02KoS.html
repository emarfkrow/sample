<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T02KoS.title}">T02_KO</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T02Ko.js}"></script>
<script th:src="@{/model/T02KoGridColumns.js}"></script>
<!-- T02_KOの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T02_KOの親モデルのグリッド定義 -->
<script th:src="@{/model/T02Oya.js}"></script>
<script th:src="@{/model/T02OyaGridColumns.js}"></script>
<!-- T02_KOの子モデルのグリッド定義 -->
<script th:src="@{/model/T02Mago.js}"></script>
<script th:src="@{/model/T02MagoGridColumns.js}"></script>
  <!-- T02_MAGOの親モデルのグリッド定義 -->
  <script th:src="@{/model/T02Orphan.js}"></script>
  <script th:src="@{/model/T02OrphanGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T02KoS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T02KoSearchForm" action="T02KoSearch.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T02KoS.legend}">legend</legend>
        <div id="oyaId">
          <label for="T02Ko.oyaId" th:text="#{T02Ko.oyaId}">OYA_ID</label><input type="text" id="T02Ko.oyaId" name="T02Ko.oyaId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="koBn">
          <label for="T02Ko.koBn" th:text="#{T02Ko.koBn}">KO_BN</label><input type="text" id="T02Ko.koBn" name="T02Ko.koBn" maxlength="10" class=" primaryKey" />
        </div>
        <div id="koInfo">
          <label for="T02Ko.koInfo" th:text="#{T02Ko.koInfo}">KO_INFO</label><input type="text" id="T02Ko.koInfo" name="T02Ko.koInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT02Ko" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
      </div>
      <div class="submits">
        <button id="SearchT02Ko" type="submit" class="search" data-gridId="T02KoGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T02KoSRegistForm" action="T02KoSRegist.ajax" class="regist">
      <h3 th:text="#{T02Ko.h3}">h3</h3>
      <div id="T02KoGrid" data-selectionMode="checkbox" data-frozenColumn="1" data-editable="false" th:data-href="@{/model/T02Ko.html}"></div>
      <div id="T02KoPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT02KoS" th:text="#{common.reset}" onClick="Base.listReset('T02Ko');">reset</button>
        <a th:href="@{T02KoSearch.xlsx(baseMei=#{T02KoS.h2})}" id="T02KoSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
      </div>
    </form>
  </div>
</body>
</html>
