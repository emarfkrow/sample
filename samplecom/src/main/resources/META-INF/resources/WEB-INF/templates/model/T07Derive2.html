<body>

      <fieldset>

        </div>
        <div id="updateTs">
          <label th:text="#{T07Derive2.updateTs}" class="meta">update_ts</label><span id="T07Derive2.updateTs" class="meta YmdHmsS"></span><input type="hidden" id="T07Derive2.updateTs" name="T07Derive2.updateTs" class="meta" />

        <button id="RegistT07Derive2" type="submit" class="regist" th:text="#{common.regist}">regist</button>
