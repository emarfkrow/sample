<!DOCTYPE html>

<meta charset="UTF-8">

<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T04Comp1.js}"></script>
<script th:src="@{/model/T04Comp1GridColumns.js}"></script>
<!-- T04_COMP1の参照モデルのグリッド定義 -->
<script th:src="@{/model/M04Ref1.js}"></script>
<script th:src="@{/model/M04Ref1GridColumns.js}"></script>

  <script th:src="@{/model/MhrUser.js}"></script>
  <script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T04_COMP1の参照モデルのグリッド定義 -->

</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T04Comp1S.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T04Comp1SearchForm" action="T04Comp1Search.ajax" class="search">
      <input type="hidden" name="rows" value="10" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T04Comp1S.legend}">legend</legend>
        <div id="ref1Id">
          <label for="T04Comp1.ref1Id" th:text="#{T04Comp1.ref1Id}">REF1_ID</label><input type="text" id="T04Comp1.ref1Id" name="T04Comp1.ref1Id" maxlength="10" class=" primaryKey refer" data-referFor="T04Comp1.ref1Id" data-json="M04Ref1Search.json" data-srcDef="REF1_ID:T04Comp1.ref1Id" data-destDef="T04Comp1.ref1Mei:ref1_mei" /><a id="T04Comp1.ref1Id" th:href="@{/model/M04Ref1S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp1.ref1Mei" class=" primaryKey refer" data-referFor="T04Comp1.ref1Id" data-json="M04Ref1Search.json" data-srcDef="REF1_ID:T04Comp1.ref1Id" data-destDef="T04Comp1.ref1Mei:ref1_mei"></span>
        </div>
        <div id="ref2Id">
          <label for="T04Comp1.ref2Id" th:text="#{T04Comp1.ref2Id}">REF2_ID</label><input type="text" id="T04Comp1.ref2Id" name="T04Comp1.ref2Id" maxlength="10" class=" primaryKey refer" data-referFor="T04Comp1.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp1.ref2Id" data-destDef="T04Comp1.ref2Mei:ref2_mei" /><a id="T04Comp1.ref2Id" th:href="@{/model/M04Ref2S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp1.ref2Mei" class=" primaryKey refer" data-referFor="T04Comp1.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp1.ref2Id" data-destDef="T04Comp1.ref2Mei:ref2_mei"></span>
        </div>
        <div id="comp1Mei">
          <label for="T04Comp1.comp1Mei" th:text="#{T04Comp1.comp1Mei}">COMP1_MEI</label><input type="text" id="T04Comp1.comp1Mei" name="T04Comp1.comp1Mei" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT04Comp1" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/T04Comp1.html(anew)}" target="dialog" id="T04Comp1" class="anew" th:text="#{T04Comp1.add}" tabindex="-1">T04_COMP1</a>
      </div>
      <div class="submits">
        <button id="SearchT04Comp1" type="submit" class="search" data-gridId="T04Comp1Grid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T04Comp1SRegistForm" action="T04Comp1SRegist.ajax" class="regist">
      <h3 th:text="#{T04Comp1.h3}">h3</h3>
      <div id="T04Comp1Grid" data-selectionMode="checkbox" data-frozenColumn="1" data-editable="false" th:data-href="@{/model/T04Comp1.html}"></div>
      <div id="T04Comp1Pager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT04Comp1S" th:text="#{common.reset}" onClick="Base.listReset('T04Comp1');">reset</button>
        <a th:href="@{T04Comp1Search.xlsx(baseMei=#{T04Comp1S.h2})}" id="T04Comp1Search.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <a id="T04Comp1Grid.ref1Id" th:href="@{/model/M04Ref1S.html}" target="dialog" class="refer gridRefer" th:text="#{M04Ref1S.title} + #{common.refer}" tabindex="-1">...</a>
        <a id="T04Comp1Grid.ref2Id" th:href="@{/model/M04Ref2S.html}" target="dialog" class="refer gridRefer" th:text="#{M04Ref2S.title} + #{common.refer}" tabindex="-1">...</a>
      </div>
      <div class="submits">
      </div>
    </form>
  </div>
</body>
</html>
