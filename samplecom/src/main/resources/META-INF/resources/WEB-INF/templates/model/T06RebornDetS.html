<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T06RebornDetS.title}">T06_REBORN_DET</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T06RebornDet.js}"></script>
<script th:src="@{/model/T06RebornDetGridColumns.js}"></script>
<!-- T06_REBORN_DETの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
<!-- T06_REBORN_DETの親モデルのグリッド定義 -->
<script th:src="@{/model/T06Reborn.js}"></script>
<script th:src="@{/model/T06RebornGridColumns.js}"></script>
  <!-- T06_REBORNの転生元モデルのグリッド定義 -->
  <script th:src="@{/model/T06Prev.js}"></script>
  <script th:src="@{/model/T06PrevGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T06RebornDetS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T06RebornDetSearchForm" action="T06RebornDetSearch.ajax" class="search">
      <input type="hidden" name="rows" value="10" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T06RebornDetS.legend}">legend</legend>
        <div id="rebornId">
          <label for="T06RebornDet.rebornId" th:text="#{T06RebornDet.rebornId}">REBORN_ID</label><input type="text" id="T06RebornDet.rebornId" name="T06RebornDet.rebornId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="rebornBn">
          <label for="T06RebornDet.rebornBn" th:text="#{T06RebornDet.rebornBn}">REBORN_BN</label><input type="text" id="T06RebornDet.rebornBn" name="T06RebornDet.rebornBn" maxlength="10" class=" primaryKey" />
        </div>
        <div id="detInfo">
          <label for="T06RebornDet.detInfo" th:text="#{T06RebornDet.detInfo}">DET_INFO</label><input type="text" id="T06RebornDet.detInfo" name="T06RebornDet.detInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT06RebornDet" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
      </div>
      <div class="submits">
        <button id="SearchT06RebornDet" type="submit" class="search" data-gridId="T06RebornDetGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T06RebornDetSRegistForm" action="T06RebornDetSRegist.ajax" class="regist">
      <h3 th:text="#{T06RebornDet.h3}">h3</h3>
      <div id="T06RebornDetGrid" data-selectionMode="checkbox" data-frozenColumn="1" th:data-href="@{/model/T06RebornDet.html}"></div>
      <div id="T06RebornDetPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT06RebornDetS" th:text="#{common.reset}" onClick="Base.listReset('T06RebornDet');">reset</button>
        <a th:href="@{T06RebornDetSearch.xlsx(baseMei=#{T06RebornDetS.h2})}" id="T06RebornDetSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <button type="submit" id="DeleteT06RebornDetS" data-action="T06RebornDetSDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistT06RebornDetS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
