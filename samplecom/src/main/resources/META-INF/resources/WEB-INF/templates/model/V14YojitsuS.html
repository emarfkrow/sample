<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{V14YojitsuS.title}">V14_YOJITSU</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/V14Yojitsu.js}"></script>
<script th:src="@{/model/V14YojitsuGridColumns.js}"></script>
<!-- V14_YOJITSUの参照モデルのグリッド定義 -->
<script th:src="@{/model/T14Koutei.js}"></script>
<script th:src="@{/model/T14KouteiGridColumns.js}"></script>
  <!-- T14_KOUTEIの参照モデルのグリッド定義 -->
  <script th:src="@{/model/MhrUser.js}"></script>
  <script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{V14YojitsuS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="V14YojitsuSearchForm" action="V14YojitsuSearch.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{V14YojitsuS.legend}">legend</legend>
        <div id="kouteiId">
          <label for="V14Yojitsu.kouteiId" th:text="#{V14Yojitsu.kouteiId}">KOUTEI_ID</label><input type="text" id="V14Yojitsu.kouteiId" name="V14Yojitsu.kouteiId" maxlength="10" class=" refer" data-referFor="V14Yojitsu.kouteiId" data-json="T14KouteiSearch.json" data-srcDef="KOUTEI_ID:V14Yojitsu.kouteiId" data-destDef="V14Yojitsu.kouteiMei:KOUTEI_MEI" /><a id="V14Yojitsu.kouteiId" th:href="@{/model/T14KouteiS.html}" target="dialog" class=" refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="V14Yojitsu.kouteiMei" class=" refer" data-referFor="V14Yojitsu.kouteiId" data-json="T14KouteiSearch.json" data-srcDef="KOUTEI_ID:V14Yojitsu.kouteiId" data-destDef="V14Yojitsu.kouteiMei:KOUTEI_MEI"></span>
        </div>
        <div id="taskId">
          <label for="V14Yojitsu.taskId" th:text="#{V14Yojitsu.taskId}">TASK_ID</label><input type="text" id="V14Yojitsu.taskId" name="V14Yojitsu.taskId" maxlength="10" class="" />
        </div>
        <div id="taskMei">
          <label for="V14Yojitsu.taskMei" th:text="#{V14Yojitsu.taskMei}">TASK_MEI</label><input type="text" id="V14Yojitsu.taskMei" name="V14Yojitsu.taskMei" maxlength="60" class="" />
        </div>
        <div id="taskStart">
          <label for="V14Yojitsu.taskStart" th:text="#{V14Yojitsu.taskStart}">TASK_START</label><input type="text" id="V14Yojitsu.taskStart" name="V14Yojitsu.taskStart" maxlength="10" class="" />
        </div>
        <div id="taskUntil">
          <label for="V14Yojitsu.taskUntil" th:text="#{V14Yojitsu.taskUntil}">TASK_UNTIL</label><input type="text" id="V14Yojitsu.taskUntil" name="V14Yojitsu.taskUntil" maxlength="10" class="" />
        </div>
        <div id="dependencies">
          <label for="V14Yojitsu.dependencies" th:text="#{V14Yojitsu.dependencies}">DEPENDENCIES</label><input type="text" id="V14Yojitsu.dependencies" name="V14Yojitsu.dependencies" maxlength="4000" class="" />
        </div>
        <div id="taskBeg">
          <label for="V14Yojitsu.taskBeg" th:text="#{V14Yojitsu.taskBeg}">TASK_BEG</label><input type="text" id="V14Yojitsu.taskBeg" name="V14Yojitsu.taskBeg" maxlength="10" class="" />
        </div>
        <div id="taskEnd">
          <label for="V14Yojitsu.taskEnd" th:text="#{V14Yojitsu.taskEnd}">TASK_END</label><input type="text" id="V14Yojitsu.taskEnd" name="V14Yojitsu.taskEnd" maxlength="10" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetV14Yojitsu" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
      </div>
      <div class="submits">
        <button id="SearchV14Yojitsu" type="submit" class="search" data-gridId="V14YojitsuGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="V14YojitsuSRegistForm" action="V14YojitsuSRegist.ajax" class="regist">
      <h3 th:text="#{V14Yojitsu.h3}">h3</h3>
      <div id="V14YojitsuGrid" data-selectionMode="checkbox" data-frozenColumn="-1" data-editable="false" th:data-href="@{/model/V14Yojitsu.html}"></div>
      <div id="V14YojitsuPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetV14YojitsuS" th:text="#{common.reset}" onClick="Base.listReset('V14Yojitsu');">reset</button>
        <a th:href="@{V14YojitsuSearch.xlsx(baseMei=#{V14YojitsuS.h2})}" id="V14YojitsuSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <a th:href="@{V14YojitsuSearch.pdf(baseMei=#{V14YojitsuS.h2})}" id="V14YojitsuSearch.pdf" th:text="#{common.pdf}" class="output" tabindex="-1" target="blank">pdf</a>
        <a id="V14YojitsuGrid.kouteiId" th:href="@{/model/T14KouteiS.html?action=T14KouteiCorrect.ajax}" target="dialog" class="refer gridRefer correct" th:text="#{T14KouteiS.title} + #{common.refer}" tabindex="-1">...</a>
      </div>
      <div class="submits">
        <button id="RegistV14YojitsuS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
