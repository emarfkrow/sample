<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M05CdS.title}">M05_CD</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M05Cd.js}"></script>
<script th:src="@{/model/M05CdGridColumns.js}"></script>
<!-- M05_CDの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M05CdS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="M05CdSearchForm" action="M05CdSearch.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{M05CdS.legend}">legend</legend>
        <div id="cdrefCd">
          <label for="M05Cd.cdrefCd" th:text="#{M05Cd.cdrefCd}">CDREF_CD</label><input type="text" id="M05Cd.cdrefCd" name="M05Cd.cdrefCd" maxlength="10" class=" primaryKey" />
        </div>
        <div id="cdrefMei">
          <label for="M05Cd.cdrefMei" th:text="#{M05Cd.cdrefMei}">CDREF_MEI</label><input type="text" id="M05Cd.cdrefMei" name="M05Cd.cdrefMei" maxlength="60" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetM05Cd" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/M05Cd.html(anew)}" target="dialog" id="M05Cd" class="anew" th:text="#{M05Cd.add}" tabindex="-1">M05_CD</a>
      </div>
      <div class="submits">
        <button id="SearchM05Cd" type="submit" class="search" data-gridId="M05CdGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="M05CdSRegistForm" action="M05CdSRegist.ajax" class="regist">
      <h3 th:text="#{M05Cd.h3}">h3</h3>
      <div id="M05CdGrid" data-selectionMode="checkbox" data-addRow="true" data-frozenColumn="0" th:data-href="@{/model/M05Cd.html}"></div>
      <div id="M05CdPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetM05CdS" th:text="#{common.reset}" onClick="Base.listReset('M05Cd');">reset</button>
        <a th:href="@{M05CdSearch.xlsx(baseMei=#{M05CdS.h2})}" id="M05CdSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <button type="submit" id="DeleteM05CdS" data-action="M05CdSDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistM05CdS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
