<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{T01YoungestS.title}">T01_YOUNGEST</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/T01Youngest.js}"></script>
<script th:src="@{/model/T01YoungestGridColumns.js}"></script>
<!-- T01_YOUNGESTの参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{T01YoungestS.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T01YoungestSearchForm" action="T01YoungestSearch.ajax" class="search">
      <input type="hidden" name="rows" value="1000" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T01YoungestS.legend}">legend</legend>
        <div id="broId">
          <label for="T01Youngest.broId" th:text="#{T01Youngest.broId}">BRO_ID</label><input type="text" id="T01Youngest.broId" name="T01Youngest.broId" maxlength="10" class=" primaryKey" />
        </div>
        <div id="youngestInfo">
          <label for="T01Youngest.youngestInfo" th:text="#{T01Youngest.youngestInfo}">YOUNGEST_INFO</label><input type="text" id="T01Youngest.youngestInfo" name="T01Youngest.youngestInfo" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT01Youngest" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
        <a th:href="@{/model/T01Youngest.html(anew)}" target="dialog" id="T01Youngest" class="anew" th:text="#{T01Youngest.add}" tabindex="-1">T01_YOUNGEST</a>
      </div>
      <div class="submits">
        <button id="SearchT01Youngest" type="submit" class="search" data-gridId="T01YoungestGrid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T01YoungestSRegistForm" action="T01YoungestSRegist.ajax" class="regist">
      <h3 th:text="#{T01Youngest.h3}">h3</h3>
      <div id="T01YoungestGrid" data-selectionMode="checkbox" data-addRow="true" data-frozenColumn="0" th:data-href="@{/model/T01Youngest.html}"></div>
      <div id="T01YoungestPager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT01YoungestS" th:text="#{common.reset}" onClick="Base.listReset('T01Youngest');">reset</button>
        <a th:href="@{T01YoungestSearch.xlsx(baseMei=#{T01YoungestS.h2})}" id="T01YoungestSearch.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <button type="submit" id="DeleteT01YoungestS" data-action="T01YoungestSDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistT01YoungestS" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
