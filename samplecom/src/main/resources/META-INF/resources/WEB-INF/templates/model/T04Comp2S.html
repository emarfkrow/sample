<body>
  <div layout:fragment="article">
    <h2 th:text="#{T04Comp2S.h2}">h2</h2>
    <!-- 検索フォーム -->
    <form name="T04Comp2SearchForm" action="T04Comp2Search.ajax" class="search">
      <input type="hidden" name="rows" value="10" />
      <input type="hidden" name="page" value="0" />
      <fieldset>
        <legend th:text="#{T04Comp2S.legend}">legend</legend>
        <div id="ref1Id">
          <label for="T04Comp2.ref1Id" th:text="#{T04Comp2.ref1Id}">REF1_ID</label><input type="text" id="T04Comp2.ref1Id" name="T04Comp2.ref1Id" maxlength="10" class=" primaryKey refer" data-referFor="T04Comp2.ref1Id" data-json="M04Ref1Search.json" data-srcDef="REF1_ID:T04Comp2.ref1Id" data-destDef="T04Comp2.ref1Mei:ref1_mei" /><a id="T04Comp2.ref1Id" th:href="@{/model/M04Ref1S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp2.ref1Mei" class=" primaryKey refer" data-referFor="T04Comp2.ref1Id" data-json="M04Ref1Search.json" data-srcDef="REF1_ID:T04Comp2.ref1Id" data-destDef="T04Comp2.ref1Mei:ref1_mei"></span>
        </div>
        <div id="ref2Id">
          <label for="T04Comp2.ref2Id" th:text="#{T04Comp2.ref2Id}">REF2_ID</label><input type="text" id="T04Comp2.ref2Id" name="T04Comp2.ref2Id" maxlength="10" class=" primaryKey refer" data-referFor="T04Comp2.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp2.ref2Id" data-destDef="T04Comp2.ref2Mei:ref2_mei" /><a id="T04Comp2.ref2Id" th:href="@{/model/M04Ref2S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp2.ref2Mei" class=" primaryKey refer" data-referFor="T04Comp2.ref2Id" data-json="M04Ref2Search.json" data-srcDef="REF2_ID:T04Comp2.ref2Id" data-destDef="T04Comp2.ref2Mei:ref2_mei"></span>
        </div>
        <div id="ref3Id">
          <label for="T04Comp2.ref3Id" th:text="#{T04Comp2.ref3Id}">REF3_ID</label><input type="text" id="T04Comp2.ref3Id" name="T04Comp2.ref3Id" maxlength="10" class=" primaryKey refer" data-referFor="T04Comp2.ref3Id" data-json="M04Ref3Search.json" data-srcDef="REF3_ID:T04Comp2.ref3Id" data-destDef="T04Comp2.ref3Mei:ref3_mei" /><a id="T04Comp2.ref3Id" th:href="@{/model/M04Ref3S.html}" target="dialog" class=" primaryKey refer" th:text="#{common.refer}" tabindex="-1">...</a><span id="T04Comp2.ref3Mei" class=" primaryKey refer" data-referFor="T04Comp2.ref3Id" data-json="M04Ref3Search.json" data-srcDef="REF3_ID:T04Comp2.ref3Id" data-destDef="T04Comp2.ref3Mei:ref3_mei"></span>
        </div>
        <div id="tekiyoBi">
          <label for="T04Comp2.tekiyoBi_1" th:text="#{T04Comp2.tekiyoBi}">TEKIYO_BI</label><input type="text" id="T04Comp2.tekiyoBi_1" name="T04Comp2.tekiyoBi_1" maxlength="10" class=" primaryKey datepicker" />～<input type="text" id="T04Comp2.tekiyoBi_2" name="T04Comp2.tekiyoBi_2" maxlength="10" class=" primaryKey datepicker" />
        </div>
        <div id="comp2Info">
          <label for="T04Comp2.comp2Info" th:text="#{T04Comp2.comp2Info}">COMP2_INFO</label><input type="text" id="T04Comp2.comp2Info" name="T04Comp2.comp2Info" maxlength="300" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="ResetT04Comp2" th:text="#{common.reset}" class="reset" onClick="Dialogate.reset(event);">reset</button>
      </div>
      <div class="submits">
        <button id="SearchT04Comp2" type="submit" class="search" data-gridId="T04Comp2Grid" th:text="#{common.search}">search</button>
      </div>
    </form>
    <!-- 一覧フォーム -->
    <form name="T04Comp2SRegistForm" action="T04Comp2SRegist.ajax" class="regist">
      <h3 th:text="#{T04Comp2.h3}">h3</h3>
      <div id="T04Comp2Grid" data-selectionMode="checkbox" data-frozenColumn="3" th:data-href="@{/model/T04Comp2.html}"></div>
      <div id="T04Comp2Pager"></div>
      <div class="buttons">
        <button type="button" class="reset" id="ResetT04Comp2S" th:text="#{common.reset}" onClick="Base.listReset('T04Comp2');">reset</button>
        <a th:href="@{T04Comp2Search.xlsx(baseMei=#{T04Comp2S.h2})}" id="T04Comp2Search.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
        <a id="T04Comp2Grid.ref1Id" th:href="@{/model/M04Ref1S.html}" target="dialog" class="refer gridRefer" th:text="#{M04Ref1S.title} + #{common.refer}" tabindex="-1">...</a>
        <a id="T04Comp2Grid.ref2Id" th:href="@{/model/M04Ref2S.html?action=M04Ref2Correct.ajax}" target="dialog" class="refer gridRefer correct" th:text="#{M04Ref2S.title} + #{common.refer}" tabindex="-1">...</a>
        <a id="T04Comp2Grid.ref3Id" th:href="@{/model/M04Ref3S.html}" target="dialog" class="refer gridRefer" th:text="#{M04Ref3S.title} + #{common.refer}" tabindex="-1">...</a>
        <button type="submit" id="DeleteT04Comp2S" data-action="T04Comp2SDelete.ajax" class="delete selectRows" th:text="#{common.delete}" tabindex="-1">delete</button>
      </div>
      <div class="submits">
        <button id="RegistT04Comp2S" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
