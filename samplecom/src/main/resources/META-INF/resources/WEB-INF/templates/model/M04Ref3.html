<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{M04Ref3.title}">M04_REF3</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/M04Ref3.js}"></script>
<script th:src="@{/model/M04Ref3GridColumns.js}"></script>
<!-- M04_REF3の参照モデルのグリッド定義 -->
<script th:src="@{/model/MhrUser.js}"></script>
<script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{M04Ref3.h2}">h2</h2>
    <form name="M04Ref3RegistForm" action="M04Ref3Regist.ajax" class="regist">
      <fieldset>
        <legend th:text="#{M04Ref3.legend}">legend</legend>
        <div id="ref3Id">
          <label for="M04Ref3.ref3Id" th:text="#{M04Ref3.ref3Id}">REF3_ID</label><input type="text" id="M04Ref3.ref3Id" name="M04Ref3.ref3Id" maxlength="10" class=" primaryKey numbering notblank" />
        </div>
        <div id="ref3Mei">
          <label for="M04Ref3.ref3Mei" th:text="#{M04Ref3.ref3Mei}">REF3_MEI</label><input type="text" id="M04Ref3.ref3Mei" name="M04Ref3.ref3Mei" maxlength="60" class=" notblank" />
        </div>
        <div id="deleteF">
          <fieldset id="M04Ref3.deleteFList" data-options="MsyKbnValSearch.json" data-optionParams="KBN_NM:delete_f" data-optionValue="KBN_VAL" data-optionLabel="KBN_VAL_MEI">
            <legend th:text="#{M04Ref3.deleteF}">delete_f</legend>
          </fieldset>
        </div>
        <div id="tekiyoBi">
          <label for="M04Ref3.tekiyoBi" th:text="#{M04Ref3.tekiyoBi}">TEKIYO_BI</label><input type="text" id="M04Ref3.tekiyoBi" name="M04Ref3.tekiyoBi" maxlength="10" class=" datepicker" />
        </div>
        <div id="haishiBi">
          <label for="M04Ref3.haishiBi" th:text="#{M04Ref3.haishiBi}">HAISHI_BI</label><input type="text" id="M04Ref3.haishiBi" name="M04Ref3.haishiBi" maxlength="10" class=" datepicker" />
        </div>
        <div id="insertTs">
          <label th:text="#{M04Ref3.insertTs}" class="meta">insert_ts</label><span id="M04Ref3.insertTs" class="meta YmdHmsS"></span><input type="hidden" id="M04Ref3.insertTs" name="M04Ref3.insertTs" class="meta" />
        </div>
        <div id="insertUserId">
          <label th:text="#{M04Ref3.insertUserId}" class="meta">insert_user_id</label><span id="M04Ref3.insertUserId" class="meta"></span><input type="hidden" id="M04Ref3.insertUserId" name="M04Ref3.insertUserId" class="meta" />
          <span id="M04Ref3.insertUserSei" class="refer meta" data-referFor="M04Ref3.insertUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M04Ref3.insertUserId" data-destDef="M04Ref3.insertUserSei:user_sei"></span>
        </div>
        <div id="updateTs">
          <label th:text="#{M04Ref3.updateTs}" class="meta">update_ts</label><span id="M04Ref3.updateTs" class="meta YmdHmsS"></span><input type="hidden" id="M04Ref3.updateTs" name="M04Ref3.updateTs" class="meta" />
        </div>
        <div id="updateUserId">
          <label th:text="#{M04Ref3.updateUserId}" class="meta">update_user_id</label><span id="M04Ref3.updateUserId" class="meta"></span><input type="hidden" id="M04Ref3.updateUserId" name="M04Ref3.updateUserId" class="meta" />
          <span id="M04Ref3.updateUserSei" class="refer meta" data-referFor="M04Ref3.updateUserId" data-json="MhrUserSearch.json" data-srcDef="USER_ID:M04Ref3.updateUserId" data-destDef="M04Ref3.updateUserSei:user_sei"></span>
        </div>
      </fieldset>
      <div class="buttons">
        <button type="button" id="RefreshM04Ref3" th:text="#{common.reset}" class="reset" onClick="Dialogate.refresh(event);">reset</button>
        <a th:href="@{M04Ref3Get.xlsx(baseMei=#{M04Ref3.h2})}" id="M04Ref3Get.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
        <button id="RegistM04Ref3" type="submit" class="regist" th:text="#{common.regist}">regist</button>
      </div>
    </form>
  </div>
</body>
</html>
